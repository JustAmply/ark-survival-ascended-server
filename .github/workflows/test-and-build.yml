name: Test and Build Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Refresh base image and OS packages even when application code is unchanged.
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR updates replace obsolete runs. Main/tag publications finish in sequence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Run tests and build AMD64 Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      IMAGE_BASENAME: ${{ github.repository_owner }}/asa-linux-server
      PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    outputs:
      image-tags: ${{ steps.metadata.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
      build-date: ${{ steps.version.outputs.build-date }}
      docker: ${{ steps.changes.outputs.docker }}
      publish-image: ${{ env.PUBLISH_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select required checks
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_changes.py

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify installed distribution
        if: steps.changes.outputs.python == 'true'
        run: |
          python -I scripts/verify_installed_package.py

      - name: Run tests
        if: steps.changes.outputs.python == 'true'
        run: |
          pytest -q

      - name: Extract version from pyproject.toml
        if: steps.changes.outputs.docker == 'true'
        id: version
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            SHORT_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            FINAL_VERSION="${VERSION}-pr${PR_NUMBER}-${SHORT_SHA}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            FINAL_VERSION="${{ github.ref_name }}"
            FINAL_VERSION="${FINAL_VERSION#v}"
          else
            FINAL_VERSION="${VERSION}"
          fi

          echo "version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "Determined version: ${FINAL_VERSION}"

      - name: Generate image metadata
        if: steps.changes.outputs.docker == 'true'
        id: metadata
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_BASENAME }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.version.outputs.version }}"

          TAGS="${IMAGE_BASE}:${VERSION}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_SHA="${{ github.event.pull_request.head.sha }}"
            PR_SHA_SHORT="${PR_SHA:0:7}"
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:pr-${PR_NUMBER}"
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:pr-${PR_NUMBER}-${PR_SHA_SHORT}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:latest"
          fi

          {
            echo "tags<<__EOF__"
            echo "${TAGS}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS//$'\n'/, }"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: asa-linux-server:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build-date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Verify application Python version and standard library
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint python asa-linux-server:smoke -c "import sys, ssl, ctypes, bz2, lzma, sqlite3, zlib; from compression import zstd; from zoneinfo import ZoneInfo; assert sys.version_info[:2] == (3, 14), sys.version; ssl.create_default_context(); ZoneInfo('Europe/Berlin'); print(sys.version)"

      - name: Verify native GE-Proton runtime dependencies
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint python asa-linux-server:smoke -c "from server_runtime.native_libs import main; raise SystemExit(main())"

      - name: Verify image control wrapper
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint /usr/local/bin/asa-ctrl asa-linux-server:smoke --help

      - name: Verify supervisor lifecycle
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --user 25000:25000 --entrypoint python \
            --mount "type=bind,src=${PWD}/scripts/verify_runtime_lifecycle.py,dst=/tmp/verify_runtime_lifecycle.py,readonly" \
            asa-linux-server:smoke /tmp/verify_runtime_lifecycle.py

      - name: Verify translated lifecycle policy with native fixtures
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --user 25000:25000 --entrypoint python \
            --mount "type=bind,src=${PWD}/scripts/verify_translated_lifecycle.py,dst=/tmp/verify_translated_lifecycle.py,readonly" \
            asa-linux-server:smoke /tmp/verify_translated_lifecycle.py --native-fixture

      - name: Log in to GHCR
        if: steps.changes.outputs.docker == 'true' && env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 Docker image
        if: steps.changes.outputs.docker == 'true' && env.PUBLISH_IMAGE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build-date }}
          # The same builder already holds the tested layers. Preserve BuildKit
          # provenance on publication without a second remote cache export.

  build-arm64-experimental:
    name: Build and verify ARM64 experimental Docker image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: test-and-build
    if: needs.test-and-build.outputs.docker == 'true'
    env:
      REGISTRY: ghcr.io
      IMAGE_BASENAME: ${{ github.repository_owner }}/asa-linux-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only the AMD64 guest build stage needs QEMU. Runtime checks below run
      # native ARM64 FEX processes and do not use QEMU for x86 execution.
      - name: Set up QEMU for the x86 RootFS build
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate ARM64 experimental image metadata
        id: metadata
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_BASENAME }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ needs.test-and-build.outputs.version }}"
          TAGS="${IMAGE_BASE}:${VERSION}-arm64-experimental"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_SHA="${{ github.event.pull_request.head.sha }}"
            PR_SHA_SHORT="${PR_SHA:0:7}"
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:pr-${PR_NUMBER}-arm64-experimental"
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:pr-${PR_NUMBER}-${PR_SHA_SHORT}-arm64-experimental"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:arm64-experimental"
          fi

          {
            echo "tags<<__EOF__"
            echo "${TAGS}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Generated ARM64 tags: ${TAGS//$'\n'/, }"

      - name: Build ARM64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          # The rolling FEX PPA removes superseded versions. Verify its current
          # ARMv8.0 package on every build; retain other caches on ordinary builds.
          no-cache-filters: ${{ github.event_name != 'schedule' && 'runtime-arm64' || '' }}
          tags: asa-linux-server:arm64-smoke
          build-args: |
            VERSION=${{ needs.test-and-build.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.test-and-build.outputs.build-date }}
          cache-from: type=gha,scope=arm64
          # Retain the native Python compiler stage for unchanged rebuilds.
          cache-to: type=gha,scope=arm64,mode=max

      - name: Disable QEMU before native ARM64 acceptance checks
        run: |
          docker run --privileged --rm tonistiigi/binfmt --uninstall 'qemu-*'
          test ! -e /proc/sys/fs/binfmt_misc/qemu-x86_64
          test ! -e /proc/sys/fs/binfmt_misc/qemu-i386

      - name: Report ARM64 image and guest RootFS size
        run: |
          docker image inspect asa-linux-server:arm64-smoke --format 'Uncompressed image bytes: {{.Size}}'
          docker run --rm --entrypoint du asa-linux-server:arm64-smoke -sx /opt/fex-rootfs

      - name: Verify application Python version and standard library
        run: |
          docker run --rm --entrypoint python asa-linux-server:arm64-smoke -c "import sys, ssl, ctypes, bz2, lzma, sqlite3, zlib; from compression import zstd; from zoneinfo import ZoneInfo; assert sys.version_info[:2] == (3, 14), sys.version; ssl.create_default_context(); ZoneInfo('Europe/Berlin'); print(sys.version)"

      - name: Verify native GE-Proton runtime dependencies
        run: |
          docker run --rm --entrypoint python asa-linux-server:arm64-smoke -m server_runtime.native_libs

      - name: Verify image control wrapper
        run: |
          docker run --rm --entrypoint /usr/local/bin/asa-ctrl asa-linux-server:arm64-smoke --help

      - name: Verify x86 execution through FEX without privileged mounts
        run: |
          ARCH=$(docker run --rm --user 25000:25000 --entrypoint FEXBash \
            asa-linux-server:arm64-smoke -c '/usr/bin/uname -m')
          test "$ARCH" = "x86_64"
          docker run --rm --user 25000:25000 --entrypoint FEXBash \
            asa-linux-server:arm64-smoke -c 'exec /lib/ld-linux.so.2 --help'
          docker run --rm --user 25000:25000 --entrypoint FEXBash \
            asa-linux-server:arm64-smoke -c 'exec python3 -c "import platform, sys; assert platform.machine() == \"x86_64\"; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"'

      - name: Verify supervisor lifecycle
        run: |
          docker run --rm --user 25000:25000 --entrypoint python \
            --mount "type=bind,src=${PWD}/scripts/verify_runtime_lifecycle.py,dst=/tmp/verify_runtime_lifecycle.py,readonly" \
            asa-linux-server:arm64-smoke /tmp/verify_runtime_lifecycle.py

      - name: Verify pinned SteamCMD, Proton and translated lifecycle through FEX
        timeout-minutes: 15
        run: |
          timeout --signal=TERM --kill-after=30s 14m \
            docker run --rm --user 25000:25000 --entrypoint python \
            --mount "type=bind,src=${PWD}/scripts/verify_arm64_translation.py,dst=/tmp/verify_arm64_translation.py,readonly" \
            --mount "type=bind,src=${PWD}/scripts/verify_translated_lifecycle.py,dst=/tmp/verify_translated_lifecycle.py,readonly" \
            asa-linux-server:arm64-smoke /tmp/verify_arm64_translation.py

      - name: Verify default latest Proton selection and translated lifecycle through FEX
        if: github.event_name == 'schedule'
        timeout-minutes: 15
        run: |
          timeout --signal=TERM --kill-after=30s 14m \
            docker run --rm --user 25000:25000 --entrypoint python \
            --mount "type=bind,src=${PWD}/scripts/verify_arm64_translation.py,dst=/tmp/verify_arm64_translation.py,readonly" \
            --mount "type=bind,src=${PWD}/scripts/verify_translated_lifecycle.py,dst=/tmp/verify_translated_lifecycle.py,readonly" \
            asa-linux-server:arm64-smoke /tmp/verify_arm64_translation.py --proton-version auto

      - name: Log in to GHCR
        if: needs.test-and-build.outputs.publish-image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 experimental Docker image
        if: needs.test-and-build.outputs.publish-image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ needs.test-and-build.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.test-and-build.outputs.build-date }}
